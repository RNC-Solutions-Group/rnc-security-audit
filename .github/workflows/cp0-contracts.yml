name: CP0 contract and Go-Rust probe

on:
  pull_request:
    paths:
      - ".github/workflows/cp0-contracts.yml"
      - "docs/contracts/**"
      - "tools/cp0/**"
      - "tests/**"
      - "requirements-cp0.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts-and-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Go compiler
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"

      - name: Select pinned Rust compiler
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
          go version
          rustc --version

      - name: Validate contracts and unit tests
        run: |
          python -m pip install -r requirements-cp0.txt
          mkdir -p artifacts/cp0
          python -m tools.cp0.validate | tee artifacts/cp0/contracts.json
          python -m unittest discover -s tests/cp0 -v

      - name: Build full synthetic fixture corpus
        run: |
          python -m tools.cp0.generate_corpus --output artifacts/cp0/corpus

      - name: Run comparable Go and Rust language probes
        run: |
          python -m tools.cp0.benchmark --runs 5 --output artifacts/cp0/benchmarks.json

      - name: Preserve CP0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cp0-contract-corpus-benchmarks
          path: artifacts/cp0/
          if-no-files-found: warn
          retention-days: 14
