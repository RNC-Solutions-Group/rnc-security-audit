[workspace]
resolver = "2"
members = ["crates/rnc-core", "crates/rnc-cli"]
exclude = ["tools/cp0/bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
authors = ["RNC Solutions Group"]
license = "Proprietary"
publish = false

[workspace.dependencies]
hex = "=0.4.3"
libc = "=0.2.191"
regex = "=1.11.1"
regex-syntax = "=0.8.11"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.140"
sha2 = "=0.10.8"
unicode-normalization = "=0.1.24"
tempfile = "=3.19.1"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
